<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vikas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16131c;
    --bg-deep: #0f0d14;
    --panel: #1d1926;
    --panel-line: #2d2838;
    --text: #efe9e2;
    --muted: #938ba3;
    --amber: #e3a23f;
    --amber-dim: #7a5a2c;
    --sage: #7fb89a;
    --danger: #d8766a;
    --radius-call: 28px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Space Grotesk", "Inter", sans-serif; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* ---------------- Login ---------------- */
  #login-overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 600px 400px at 50% 20%, rgba(227,162,63,0.10), transparent),
      var(--bg-deep);
    z-index: 100; padding: 24px;
  }
  .login-card { width: 100%; max-width: 360px; text-align: center; }
  .login-mark {
    width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #f3c572, var(--amber) 55%, var(--amber-dim) 100%);
  }
  .login-card h1 {
    font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 28px;
    margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .login-card p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 32px; }
  #google-btn {
    width: 100%; padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--panel-line);
    background: var(--panel); color: var(--text); font-size: 14.5px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: border-color 120ms ease, background 120ms ease;
  }
  #google-btn:hover { border-color: var(--amber-dim); background: #221d2d; }
  #google-btn svg { flex-shrink: 0; }
  .login-error { color: var(--danger); font-size: 13.5px; margin-top: 16px; min-height: 18px; }

  /* ---------------- Shell ---------------- */
  #dashboard { display: none; min-height: 100vh; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--panel-line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #f3c572, var(--amber) 55%, var(--amber-dim) 100%); }
  .brand span { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 17px; }
  .user-chip { display: flex; align-items: center; gap: 12px; }
  .user-chip img { width: 30px; height: 30px; border-radius: 50%; display: block; }
  .user-chip .who { font-size: 13.5px; color: var(--muted); }
  .link-btn {
    background: none; border: none; color: var(--muted); font-size: 13.5px; cursor: pointer; padding: 4px 0;
  }
  .link-btn:hover { color: var(--text); }

  .layout {
    flex: 1; display: grid; grid-template-columns: 300px 1fr; gap: 24px;
    padding: 28px; max-width: 1080px; margin: 0 auto; width: 100%;
  }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; padding: 16px; gap: 16px; } }

  /* ---------------- Call deck ---------------- */
  .call-deck {
    background: radial-gradient(ellipse 320px 220px at 50% -10%, rgba(227,162,63,0.08), transparent), var(--panel);
    border: 1px solid var(--panel-line); border-radius: var(--radius-call);
    padding: 32px 24px; text-align: center;
  }
  .orb-wrap { position: relative; width: 112px; height: 112px; margin: 4px auto 20px; }
  .orb-ring {
    position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(227,162,63,0.35);
    opacity: 0; transform: scale(0.8);
  }
  .orb-wrap.listening .orb-ring {
    animation: ring 1.8s ease-out infinite;
  }
  .orb-wrap.listening .orb-ring:nth-child(2) { animation-delay: .6s; }
  .orb-wrap.listening .orb-ring:nth-child(3) { animation-delay: 1.2s; }
  @keyframes ring {
    0% { opacity: .55; transform: scale(0.72); }
    100% { opacity: 0; transform: scale(1.35); }
  }
  .orb {
    position: absolute; inset: 20px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #f3c572, var(--amber) 55%, #96681f 100%);
    transition: inset 200ms ease;
  }
  .orb-wrap.listening .orb { inset: 14px; }

  .call-status { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; min-height: 17px; }
  .call-btn {
    width: 100%; padding: 13px; border-radius: var(--radius-sm); border: none; cursor: pointer;
    font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 120ms ease, color 120ms ease;
  }
  .call-btn.start { background: var(--amber); color: #2a1c05; }
  .call-btn.start:hover { background: #ecb45c; }
  .call-btn.stop { background: var(--danger); color: #2c0f0a; }
  .new-convo {
    margin-top: 10px; width: 100%; background: none; border: 1px solid var(--panel-line); color: var(--muted);
    padding: 11px; border-radius: var(--radius-sm); font-size: 13.5px; cursor: pointer;
  }
  .new-convo:hover { border-color: var(--amber-dim); color: var(--text); }

  /* ---------------- Knowledge base ---------------- */
  .kb-card { margin-top: 16px; border: 1px solid var(--panel-line); border-radius: 16px; padding: 18px; }
  .kb-card h3 { margin: 0 0 10px; font-size: 13.5px; font-weight: 500; color: var(--text); }
  .kb-list { display: flex; flex-direction: column; gap: 6px; max-height: 120px; overflow-y: auto; }
  .kb-item {
    font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px;
    padding: 2px 0;
  }
  .kb-item .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sage); flex-shrink: 0; }
  .kb-empty { font-size: 12.5px; color: var(--muted); }

  /* ---------------- Transcript ---------------- */
  .chat-card { display: flex; flex-direction: column; height: 72vh; }
  .feed { flex: 1; overflow-y: auto; padding: 4px 6px 4px 0; margin-bottom: 14px; }
  .turn { margin-bottom: 16px; max-width: 86%; }
  .turn.user { margin-left: auto; text-align: right; }
  .turn-label { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .turn.user .turn-label { color: var(--amber-dim); }
  .turn-text { font-size: 15px; line-height: 1.5; color: var(--text); }
  .turn.user .turn-text { color: #f3d9a6; }
  .turn.system {
    margin: 0 auto 14px; max-width: 95%; text-align: center; font-size: 12.5px;
    color: var(--muted); border: 1px dashed var(--panel-line); border-radius: var(--radius-sm); padding: 8px 12px;
  }
  .typing { color: var(--muted); font-size: 13px; margin-bottom: 10px; }

  .chat-input-row { display: flex; gap: 8px; align-items: center; }
  .upload-btn {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--panel-line);
    background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: border-color 120ms, color 120ms;
  }
  .upload-btn:hover { border-color: var(--amber-dim); color: var(--amber); }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .chat-input-row input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--panel-line); color: var(--text);
    padding: 12px 15px; border-radius: var(--radius-sm); font-size: 14.5px;
  }
  .chat-input-row input[type=text]::placeholder { color: var(--muted); }
  .chat-input-row button#send-btn {
    background: var(--amber); color: #2a1c05; border: none; padding: 12px 18px;
    border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; font-size: 14.5px;
  }
  .chat-input-row button#send-btn:hover { background: #ecb45c; }
  .speak-toggle {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); margin-top: 12px;
  }
  .speak-toggle input { accent-color: var(--amber); }
</style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-card">
      <div class="login-mark"></div>
      <h1>Talk to Vikas</h1>
      <p>Your voice assistant for quick answers, documents, and conversation — by call or by text.</p>
      <button id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9A8.78 8.78 0 0 0 17.64 9.2z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.36 0-4.37-1.6-5.08-3.74H.92v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.92 10.68a5.4 5.4 0 0 1 0-3.36V5H.92a9 9 0 0 0 0 8l3-2.32z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.96 8.96 0 0 0 9 0 9 9 0 0 0 .92 5l3 2.32C4.63 5.18 6.64 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div id="dashboard">
    <div class="topbar">
      <div class="brand"><span class="mark"></span><span>Vikas</span></div>
      <div class="user-chip">
        <img id="user-avatar" src="" alt="" />
        <span class="who" id="user-name"></span>
        <button class="link-btn" id="logout-btn">Sign out</button>
      </div>
    </div>

    <div class="layout">
      <div>
        <div class="call-deck">
          <div class="orb-wrap" id="orb-wrap">
            <div class="orb-ring"></div>
            <div class="orb-ring"></div>
            <div class="orb-ring"></div>
            <div class="orb"></div>
          </div>
          <div class="call-status" id="call-status">Tap to talk</div>
          <button class="call-btn start" id="call-btn">Start talking</button>
          <button class="new-convo" id="new-convo-btn">New conversation</button>
        </div>

        <div class="kb-card">
          <h3>Documents in this session</h3>
          <div class="kb-list" id="kb-list">
            <div class="kb-empty" id="kb-empty">Nothing uploaded yet.</div>
          </div>
        </div>
      </div>

      <div class="chat-card">
        <div class="feed" id="feed"></div>
        <div class="chat-input-row">
          <input type="file" id="file-input" accept="application/pdf" hidden />
          <button class="upload-btn" id="upload-btn" title="Upload a PDF to ask questions about">+</button>
          <input type="text" id="chat-input" placeholder="Message Vikas…" />
          <button id="send-btn">Send</button>
        </div>
        <label class="speak-toggle">
          <input type="checkbox" id="speak-toggle" /> Read replies aloud
        </label>
      </div>
    </div>
  </div>

<script type="module">
// ============================================================
// Backend + auth location — this file is a standalone static client.
// API_BASE_URL: wherever server.py is deployed.
// Neon Auth base URL is fetched from the backend's /config.
// ============================================================
const API_BASE_URL = window.API_BASE_URL || "http://localhost:8000";

import { createAuthClient } from "https://esm.sh/better-auth/client";

let authClient = null;
let currentToken = null;

async function initAuthClient() {
  const res = await fetch(`${API_BASE_URL}/config`);
  const cfg = await res.json();
  authClient = createAuthClient({
    baseURL: cfg.neon_auth_base_url,
    fetchOptions: { credentials: "include" }, // needed cross-origin, or token() returns undefined
  });
}

// Every authenticated request goes through this — same pattern a phone app
// would use: attach the Neon Auth JWT as a Bearer header, never a cookie,
// to OUR backend (the cookie lives on the Neon Auth origin, not ours).
async function authFetch(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (currentToken) headers["Authorization"] = `Bearer ${currentToken}`;
  let res = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });
  if (res.status === 401) {
    const refreshed = await refreshToken();
    if (refreshed) {
      headers["Authorization"] = `Bearer ${currentToken}`;
      res = await fetch(`${API_BASE_URL}${path}`, { ...options, headers });
    }
    if (res.status === 401) showLogin();
  }
  return res;
}

async function refreshToken() {
  try {
    const { data } = await authClient.token();
    if (data?.token) { currentToken = data.token; return true; }
  } catch {}
  currentToken = null;
  return false;
}

let callId = sessionStorage.getItem("callId") || crypto.randomUUID();
sessionStorage.setItem("callId", callId);

const feed = document.getElementById("feed");
const orbWrap = document.getElementById("orb-wrap");
const callStatus = document.getElementById("call-status");
const callBtn = document.getElementById("call-btn");
const kbList = document.getElementById("kb-list");
const kbEmpty = document.getElementById("kb-empty");
const uploadBtn = document.getElementById("upload-btn");
const fileInput = document.getElementById("file-input");

let mediaRecorder, audioChunks = [];
let isRecording = false;
let audioQueue = [];
let playingIndex = -1;
let currentAudioEl = null;
let typingEl = null;
let lastSpeaker = null; // tracks transcript grouping so we don't repeat the label every line

function addTurn(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "turn " + role;
  if (role !== "system" && lastSpeaker !== role) {
    const label = document.createElement("div");
    label.className = "turn-label";
    label.textContent = role === "user" ? "You" : "Vikas";
    wrap.appendChild(label);
  }
  const textEl = document.createElement("div");
  textEl.className = "turn-text";
  textEl.textContent = text;
  wrap.appendChild(textEl);
  feed.appendChild(wrap);
  feed.scrollTop = feed.scrollHeight;
  lastSpeaker = role === "system" ? lastSpeaker : role;
  return textEl;
}

function showTyping() {
  hideTyping();
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.textContent = "Vikas is typing…";
  feed.appendChild(typingEl);
  feed.scrollTop = feed.scrollHeight;
}
function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

function showLogin() {
  document.getElementById("login-overlay").style.display = "flex";
  document.getElementById("dashboard").style.display = "none";
}
function showDashboard(user) {
  document.getElementById("login-overlay").style.display = "none";
  document.getElementById("dashboard").style.display = "flex";
  document.getElementById("user-avatar").src = user.image || user.picture || "";
  document.getElementById("user-name").textContent = user.name || user.email;
}

// -------------------- Auth --------------------
async function trySession() {
  const ok = await refreshToken();
  if (!ok) { showLogin(); return; }
  const { data } = await authClient.getSession();
  if (data?.user) {
    showDashboard(data.user);
  } else {
    showLogin();
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  await initAuthClient();
  document.getElementById("google-btn").onclick = () => {
    authClient.signIn.social({ provider: "google", callbackURL: window.location.href });
  };
  await trySession();
});

document.getElementById("logout-btn").onclick = async () => {
  try { await authClient.signOut(); } catch {}
  currentToken = null;
  showLogin();
};

document.getElementById("new-convo-btn").onclick = () => {
  callId = crypto.randomUUID();
  sessionStorage.setItem("callId", callId);
  feed.innerHTML = "";
  lastSpeaker = null;
  // Uploaded documents stay searchable across conversations (they live in
  // Qdrant, not the conversation thread) — only the transcript resets.
};

// -------------------- Document upload --------------------
uploadBtn.onclick = () => fileInput.click();

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;

  if (file.type !== "application/pdf") {
    addTurn("system", "Only PDF files are supported right now.");
    return;
  }

  uploadBtn.disabled = true;
  const statusEl = addTurn("system", `Indexing "${file.name}"…`);

  const form = new FormData();
  form.append("file", file);

  try {
    const res = await authFetch("/ingest", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Ingestion failed");

    statusEl.textContent = `Indexed "${file.name}" — ask Vikas anything about it`;
    if (kbEmpty) kbEmpty.remove();
    const item = document.createElement("div");
    item.className = "kb-item";
    item.innerHTML = `<span class="dot"></span>${file.name}`;
    kbList.appendChild(item);
  } catch (e) {
    statusEl.textContent = `Couldn't index "${file.name}": ${e.message}`;
  } finally {
    uploadBtn.disabled = false;
  }
});

// -------------------- Text chat --------------------
async function sendChat() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addTurn("user", text);
  showTyping();

  const speak = document.getElementById("speak-toggle").checked;
  try {
    const res = await authFetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ call_id: callId, message: text, speak }),
    });
    const data = await res.json();
    hideTyping();
    if (!res.ok) { addTurn("agent", data.detail || "Something went wrong — try again."); return; }
    addTurn("agent", data.reply);
    if (data.audio) new Audio("data:audio/mpeg;base64," + data.audio).play();
  } catch (e) {
    hideTyping();
    addTurn("agent", "Couldn't reach the server.");
  }
}
document.getElementById("send-btn").onclick = sendChat;
document.getElementById("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendChat();
});

// -------------------- Voice call --------------------
async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];
  mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
  mediaRecorder.onstop = sendTurn;
  mediaRecorder.start();
  isRecording = true;
  orbWrap.classList.add("listening");
  callStatus.textContent = "Listening… tap to stop";
  callBtn.textContent = "Stop";
  callBtn.classList.replace("start", "stop");

  if (currentAudioEl && !currentAudioEl.paused) {
    currentAudioEl.pause();
    authFetch(`/interrupt?call_id=${callId}&n=${playingIndex}`, { method: "POST" });
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    orbWrap.classList.remove("listening");
    callStatus.textContent = "Thinking…";
    callBtn.textContent = "Start talking";
    callBtn.classList.replace("stop", "start");
  }
}

callBtn.onclick = () => { isRecording ? stopRecording() : startRecording(); };

async function sendTurn() {
  const blob = new Blob(audioChunks, { type: "audio/webm" });
  const form = new FormData();
  form.append("audio", blob, "audio.webm");

  const res = await authFetch(`/turn?call_id=${callId}`, { method: "POST", body: form });
  if (!res.ok) {
    callStatus.textContent = "Error — tap to try again";
    return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  audioQueue = [];
  playingIndex = -1;

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const l of lines) {
      if (!l.trim()) continue;
      const msg = JSON.parse(l);
      if (msg.type === "user") {
        addTurn("user", msg.text);
      } else if (msg.type === "sentence") {
        addTurn("agent", msg.text);
        audioQueue.push(msg.audio);
        if (audioQueue.length === 1) playNext();
      } else if (msg.type === "empty") {
        callStatus.textContent = "Didn't catch that — tap to try again";
      } else if (msg.type === "wait") {
        callStatus.textContent = "Still listening…";
      } else if (msg.type === "done") {
        callStatus.textContent = "Tap to talk";
      }
    }
  }
}

function playNext() {
  playingIndex++;
  if (playingIndex >= audioQueue.length) { playingIndex = -1; return; }
  currentAudioEl = new Audio("data:audio/mpeg;base64," + audioQueue[playingIndex]);
  currentAudioEl.onended = playNext;
  currentAudioEl.play();
}
</script>
</body>
</html>
